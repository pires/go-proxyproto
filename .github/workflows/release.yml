name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  actionlint:
    uses: ./.github/workflows/actionlint.yml

  release:
    needs: actionlint
    permissions:
      contents: write # Required to create releases and generate release notes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
